name: Fast Linux Build & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: fast-linux-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies & mold linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mold clang pkg-config libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: fast-linux-x86_64
          cache-all-crates: "true"

      - name: Compile release binary with mold
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
        run: |
          cargo build --release --bin jcode

      - name: Package artifacts
        run: |
          mkdir -p dist
          # Strip symbols to minimize binary size
          strip target/release/jcode
          
          # Standalone binary
          cp target/release/jcode dist/jcode-linux-x86_64
          chmod +x dist/jcode-linux-x86_64
          
          # Tarball archive
          tar -czvf dist/jcode-linux-x86_64.tar.gz -C target/release jcode
          
          # Compute sha256 checksums
          cd dist
          sha256sum jcode-linux-x86_64 jcode-linux-x86_64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcode-linux-x86_64
          path: dist/*
          retention-days: 14

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          TAG_NAME="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          
          echo "Target Release Tag: $TAG_NAME"
          
          # Check if the release exists
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" dist/* \
              --title "Release $TAG_NAME" \
              --notes "Fast automated build from commit ${{ github.sha }}" \
              --prerelease=false
          else
            echo "Updating existing release $TAG_NAME..."
            gh release upload "$TAG_NAME" dist/* --clobber
          fi
